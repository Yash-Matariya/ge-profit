services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geprofit
      POSTGRES_USER: geprofit
      POSTGRES_PASSWORD: geprofit
    ports:
      # 5433 on the host, not 5432. A locally-installed Postgres commonly owns
      # 5432, and it binds localhost specifically while Docker binds the
      # wildcard -- so localhost:5432 silently reaches the native server and
      # you get "role does not exist" from a database you did not mean to use.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend waits for this, so it does not start against a database
      # that is still initialising and then die on the first connection.
      test: ["CMD-SHELL", "pg_isready -U geprofit -d geprofit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
